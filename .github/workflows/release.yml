# Every push to main updates one release PR (version.txt and CHANGELOG.md from the feat:/fix:
# commits since the last release). Merging it tags vX.Y.Z and makes the GitHub Release. The second job
# builds the tweak on every push, with the Xcode build-ipa.yml uses, so a change that compiles only with a
# newer SDK than that is caught before a release is cut from it. The .deb the build makes is kept as an
# artifact and, when a release is cut, attached to it. It is a jailbreak package for the app as it ships:
# the Info.plist overrides the IPA build merges in (the redesign's) are not part of it. No IPA is built here.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      # The flag table is read out of Spotify's binary (make flags), so it comes from a secret
      # instead of an IPA: gzip -9c tweak/Sources/Shared/Flags/SGFlagList.m | base64 | gh secret set SG_FLAG_LIST
      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          [ -n "$SG_FLAG_LIST" ] || { echo "::error::the SG_FLAG_LIST secret is not set"; exit 1; }
          echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package

      - name: Keep the .deb
        uses: actions/upload-artifact@v4
        with:
          name: com.vitrine.tweak
          path: tweak/packages/*.deb
          if-no-files-found: error

  attach-deb:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: com.vitrine.tweak
          path: deb
      - name: Attach the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" deb/*.deb --clobber
